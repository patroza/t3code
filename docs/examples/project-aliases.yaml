# Discord bot project shortName → workspace root mapping.
# Loaded by the bot only (not the T3 server):
#
#   export T3_PROJECT_ALIASES_PATH=~/.t3/discord-bot/project-aliases.yaml
#   pnpm --filter @t3tools/discord-bot start
#
# Channel topics use: t3-<shortName>  (e.g. t3-example-project)

example-project: ~/projects/example-project
# t3-code: ~/pj/t3code

# Structured form is also supported:
# aliases:
#   example-project:
#     workspaceRoot: ~/projects/example-project
