# Slow path only: full main → tim → candidates → changes rewrite + overlay cascade.
# Day-to-day merges onto fork/changes use "Compose fork integration" instead.
#
# This workflow is intentionally left DISABLED at repository level (disabled_manually).
# Do not enable it for schedule/push automation. Prefer local:
#   node scripts/rebase-pr-stack.ts sync --push
# if a full provenance restack is required.
name: Rebase fork PR stack

on:
  workflow_dispatch:

concurrency:
  group: fork-pr-stack
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read
  actions: write

jobs:
  rebase:
    name: Rebase stack and compose integration
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout canonical fork changes
        uses: actions/checkout@v6
        with:
          ref: fork/changes
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Configure protected stack push key
        env:
          FORK_STACK_DEPLOY_KEY: ${{ secrets.FORK_STACK_DEPLOY_KEY }}
        run: |
          if [[ -z "${FORK_STACK_DEPLOY_KEY}" ]]; then
            echo "error: FORK_STACK_DEPLOY_KEY secret is required to rewrite stack branches" >&2
            exit 1
          fi
          key_path="${RUNNER_TEMP}/fork-stack-deploy-key"
          printf '%s\n' "${FORK_STACK_DEPLOY_KEY}" > "${key_path}"
          chmod 600 "${key_path}"
          ssh-keyscan -H github.com >> "${RUNNER_TEMP}/github-known-hosts"
          echo "GIT_SSH_COMMAND=ssh -i ${key_path} -o IdentitiesOnly=yes -o UserKnownHostsFile=${RUNNER_TEMP}/github-known-hosts" >> "${GITHUB_ENV}"
          git remote set-url origin "git@github.com:${GITHUB_REPOSITORY}.git"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/pingdotgg/t3code.git

      - name: Rebase and atomically update stack
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/rebase-pr-stack.ts sync --push

      - name: Compose registered integration overlays
        env:
          COMPOSE_WORK_ROOT: ${{ runner.temp }}/compose-work
        run: node scripts/compose-integration-overlays.ts

      - name: Dispatch integration CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run fork-ci.yml --repo "$GITHUB_REPOSITORY" --ref fork/integration
