name: Mobile EAS Production

# Production builds and OTA updates run from CI (Linux) — never from a laptop.
# Under the fingerprint runtime-version policy the fingerprint must be computed
# in the same OS/pnpm as the EAS build; a macOS `eas build` computes a different
# fingerprint (platform-specific deps + pnpm version) and errors. On this Linux
# runner, with corepack pinning pnpm 10.24 in eas.json, local == build.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [fork/integration]
  workflow_dispatch:
    inputs:
      mode:
        description: "build (+ auto-submit to TestFlight) or update (OTA)"
        required: true
        type: choice
        default: build
        options:
          - build
          - update
      platform:
        description: "Target platform"
        required: true
        type: choice
        default: ios
        options:
          - ios
          - android
          - all
      message:
        description: "OTA update message (mode=update only)"
        required: false
        type: string
      sha:
        description: "Exact fork/integration SHA (blank uses its current tip)"
        required: false
        type: string

concurrency:
  group: mobile-eas-production
  cancel-in-progress: false

jobs:
  production:
    name: EAS Production ${{ inputs.mode }}
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      APP_VARIANT: production
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - id: expo-token
        name: Check for EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "EXPO_TOKEN is not available; skipping EAS production job."
          fi

      - name: Checkout
        if: steps.expo-token.outputs.present == 'true'
        uses: actions/checkout@v6
        with:
          ref: fork/integration
          fetch-depth: 0

      - id: source
        name: Resolve approved integration source
        if: steps.expo-token.outputs.present == 'true'
        env:
          REQUESTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.sha }}
        run: |
          integration_sha="$(git rev-parse HEAD)"
          target_sha="${REQUESTED_SHA:-$integration_sha}"
          if [[ ! "$target_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "sha must be an exact 40-character commit SHA" >&2
            exit 1
          fi
          git fetch origin "$target_sha"
          git merge-base --is-ancestor "$target_sha" "$integration_sha"
          git checkout --detach "$target_sha"
          test "$(git rev-parse HEAD)" = "$target_sha"
          echo "sha=$target_sha" >> "$GITHUB_OUTPUT"

      - name: Setup Vite+
        if: steps.expo-token.outputs.present == 'true'
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Expose pnpm
        if: steps.expo-token.outputs.present == 'true'
        run: |
          pnpm_version="$(node --print "require('./package.json').packageManager.split('@').pop()")"
          vp_pnpm_bin="$HOME/.vite-plus/package_manager/pnpm/$pnpm_version/pnpm/bin"
          echo "$vp_pnpm_bin" >> "$GITHUB_PATH"
          "$vp_pnpm_bin/pnpm" --version

      - name: Setup EAS
        if: steps.expo-token.outputs.present == 'true'
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          # npm, not pnpm: this only installs eas-cli into the action's own
          # tool dir, and pnpm 11 hard-fails that install on dtrace-provider's
          # ignored build script (no allowBuilds config outside the repo).
          packager: npm

      - name: Pull production environment variables
        if: steps.expo-token.outputs.present == 'true'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas env:pull production --non-interactive

      - name: Build and submit
        if: >-
          steps.expo-token.outputs.present == 'true' &&
          github.event_name == 'workflow_dispatch' &&
          inputs.mode == 'build'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform ${{ inputs.platform }} --profile production --auto-submit --non-interactive --no-wait

      - name: Publish OTA update
        if: >-
          steps.expo-token.outputs.present == 'true' &&
          (github.event_name == 'workflow_run' || inputs.mode == 'update')
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas update \
            --channel production \
            --environment production \
            --platform ${{ inputs.platform }} \
            --message "${{ inputs.message || format('Production OTA ({0})', steps.source.outputs.sha) }}" \
            --non-interactive
