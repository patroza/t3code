name: Mobile EAS Production

# Production builds and OTA updates run from CI (Linux) — never from a laptop.
# Under the fingerprint runtime-version policy the fingerprint must be computed
# in the same OS/pnpm as the EAS build; a macOS `eas build` computes a different
# fingerprint (platform-specific deps + pnpm version) and errors. On this Linux
# runner, with corepack pinning pnpm 10.24 in eas.json, local == build.
#
# mode=auto uses apps/mobile/scripts/eas-continuous-deploy.sh (full logs). When a
# native rebuild is needed but blocked (e.g. Expo Free plan monthly iOS quota),
# it falls back to OTA against the latest finished production binary runtime so
# pure-JS fixes still reach installed TestFlight clients.
#
# Manual store builds: if the latest production build's version differs from
# app.config.ts, cut a new build and submit it (TestFlight + Play internal
# track). Bumping `version` starts the next release train — the first build of
# a version enters external-TestFlight beta review immediately, and later
# builds of the same version auto-approve until that version is released.
# After App Store approval, Apple closes the release train and `version` must
# be bumped before another iOS build can be submitted. Releasing to the App
# Store stays a manual App Store Connect step.
# Manual v2-preview builds keep the production app identity and disable OTA.
# Select the v2 branch when dispatching a preview build.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "auto (fingerprint decides), build (+ auto-submit to TestFlight), or update (OTA)"
        required: true
        type: choice
        default: auto
        options:
          - auto
          - build
          - update
      profile:
        description: "Store build profile (v2-preview supports build mode only)"
        required: true
        type: choice
        default: production
        options:
          - production
          - v2-preview
      platform:
        description: "Target platform"
        required: true
        type: choice
        default: ios
        options:
          - ios
          - android
          - all
      version:
        description: "Optional build version override (blank uses app.config.ts; an override is committed before building)"
        required: false
        type: string
      message:
        description: "OTA update message (mode=update / auto)"
        required: false
        type: string
      runtime_version:
        description: "Force OTA runtimeVersion (mode=update or auto). Blank = fingerprint / fallback"
        required: false
        type: string
      sha:
        description: "Exact release-branch SHA (blank uses that branch's current tip)"
        required: false
        type: string
      release_branch:
        description: "Release branch that must contain the SHA"
        required: false
        type: string
        default: fork/integration

concurrency:
  group: mobile-eas-production
  cancel-in-progress: false

jobs:
  production:
    name: EAS ${{ inputs.profile || 'production' }} ${{ inputs.mode }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      APP_VARIANT: production
      NODE_OPTIONS: --max-old-space-size=8192
      T3CODE_MOBILE_EAS_PROJECT_ID: ${{ vars.T3CODE_MOBILE_EAS_PROJECT_ID }}
      T3CODE_MOBILE_EXPO_OWNER: ${{ vars.T3CODE_MOBILE_EXPO_OWNER }}
      T3CODE_MOBILE_IOS_BUNDLE_IDENTIFIER: ${{ vars.T3CODE_MOBILE_IOS_BUNDLE_IDENTIFIER }}
      T3CODE_MOBILE_IOS_TEAM_ID: ${{ vars.T3CODE_MOBILE_IOS_TEAM_ID }}
    steps:
      - name: Reject preview OTA updates
        if: github.event_name == 'workflow_dispatch' && inputs.profile == 'v2-preview' && inputs.mode == 'update'
        run: |
          echo "::error::V2 previews use store builds only. Select mode=build."
          exit 1

      - id: expo-token
        name: Check for EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "EXPO_TOKEN is not available; skipping EAS production job."
          fi

      - id: version_app_token
        name: Mint release app token for version override
        if: steps.expo-token.outputs.present == 'true' && github.event_name == 'workflow_dispatch' && inputs.mode == 'build' && inputs.version != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout
        if: steps.expo-token.outputs.present == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_branch }}
          fetch-depth: 0
          token: ${{ steps.version_app_token.outputs.token || github.token }}
          # No sparse-checkout here: it makes actions/checkout fetch with
          # --filter=blob:none, and eas-cli archives the project via
          # `git clone --depth 1 file://<workspace>`, which fails (exit 128)
          # when the partial clone can't serve the unfetched blobs.

      - id: source
        name: Resolve approved integration source
        if: steps.expo-token.outputs.present == 'true'
        env:
          REQUESTED_SHA: ${{ inputs.sha }}
        run: |
          integration_sha="$(git rev-parse HEAD)"
          target_sha="${REQUESTED_SHA:-$integration_sha}"
          if [[ ! "$target_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "sha must be an exact 40-character commit SHA" >&2
            exit 1
          fi
          git fetch origin "$target_sha"
          git merge-base --is-ancestor "$target_sha" "$integration_sha"
          git checkout --detach "$target_sha"
          test "$(git rev-parse HEAD)" = "$target_sha"
          echo "sha=$target_sha" >> "$GITHUB_OUTPUT"

      # Workflow file may come from a feature branch (workflow_dispatch --ref)
      # while product code is always the approved integration SHA above. Overlay
      # the deploy script + app.config runtime override from the workflow ref so
      # we can ship fixes without waiting for a full compose.
      - name: Overlay deploy tooling from workflow ref
        if: steps.expo-token.outputs.present == 'true' && github.ref_name != inputs.release_branch
        env:
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          git fetch origin "$WORKFLOW_SHA"
          for path in \
            apps/mobile/scripts/eas-continuous-deploy.sh \
            apps/mobile/scripts/lib \
            apps/mobile/app.config.ts \
            .easignore; do
            if git cat-file -e "${WORKFLOW_SHA}:${path}" 2>/dev/null; then
              git checkout "$WORKFLOW_SHA" -- "$path"
              echo "overlaid $path from $WORKFLOW_SHA"
            fi
          done
          chmod +x apps/mobile/scripts/eas-continuous-deploy.sh

      - name: Setup Vite+
        if: steps.expo-token.outputs.present == 'true'
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/mobile...

      - name: Verify v2 preview source
        if: steps.expo-token.outputs.present == 'true' && github.event_name == 'workflow_dispatch' && inputs.profile == 'v2-preview'
        run: |
          node --input-type=module -e '
            import * as environment from "./packages/contracts/src/environment.ts";
            if (environment.ORCHESTRATION_PROTOCOL_VERSION !== 2) {
              throw new Error("V2 previews require a v2 source branch. Select the v2 branch when running this workflow.");
            }
          '

      - name: Expose pnpm
        if: steps.expo-token.outputs.present == 'true'
        run: |
          pnpm_version="$(node --print "require('./package.json').packageManager.split('@').pop()")"
          vp_pnpm_bin="$HOME/.vite-plus/package_manager/pnpm/$pnpm_version/pnpm/bin"
          echo "$vp_pnpm_bin" >> "$GITHUB_PATH"
          "$vp_pnpm_bin/pnpm" --version

      - name: Setup EAS
        if: steps.expo-token.outputs.present == 'true'
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          # npm, not pnpm: this only installs eas-cli into the action's own
          # tool dir, and pnpm 11 hard-fails that install on dtrace-provider's
          # ignored build script (no allowBuilds config outside the repo).
          packager: npm

      - name: Pull production environment variables
        if: steps.expo-token.outputs.present == 'true'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas env:pull production --non-interactive

      - name: Apply manual version override
        if: steps.version_app_token.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.version_app_token.outputs.token }}
          APP_SLUG: ${{ steps.version_app_token.outputs.app-slug }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" != "branch" ]; then
            echo "Version overrides require dispatching this workflow from a branch; received $GITHUB_REF_TYPE '$GITHUB_REF_NAME'." >&2
            exit 1
          fi
          if ! [[ "$RELEASE_VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then
            echo "Version override must contain two or three dot-separated integers; received '$RELEASE_VERSION'." >&2
            exit 1
          fi

          node --input-type=module -e '
            import fs from "node:fs";
            const path = "apps/mobile/app.config.ts";
            const source = fs.readFileSync(path, "utf8");
            const next = source.replace(
              /^(  version: ")[^"]+(".*)$/m,
              `$1${process.env.RELEASE_VERSION}$2`,
            );
            if (next === source && !source.includes(`  version: "${process.env.RELEASE_VERSION}"`)) {
              throw new Error("Could not update app version");
            }
            fs.writeFileSync(path, next);
          '
          vp fmt apps/mobile/app.config.ts

          if git diff --quiet -- apps/mobile/app.config.ts; then
            echo "app.config.ts is already at $RELEASE_VERSION; no version commit needed."
            exit 0
          fi

          user_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git add apps/mobile/app.config.ts
          git commit \
            -m "chore(mobile): bump app version to $RELEASE_VERSION" \
            -m "Co-authored-by: codex <codex@users.noreply.github.com>"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"

      - name: Summarize manual build version
        if: steps.expo-token.outputs.present == 'true' && github.event_name == 'workflow_dispatch' && inputs.mode == 'build'
        working-directory: apps/mobile
        env:
          MOBILE_BUILD_PROFILE: ${{ inputs.profile || 'production' }}
        run: |
          version="$(npx expo config --json --type public | jq -r '.version')"
          {
            echo "## Manual $MOBILE_BUILD_PROFILE build"
            echo
            echo "- App version: \`$version\`"
            echo "- Platform: \`${{ inputs.platform }}\`"
            echo
            echo "> Apple closes an iOS release train after App Store approval. Before building iOS, confirm \`$version\` is newer than the approved App Store version."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy with fingerprint check (auto)
        if: steps.expo-token.outputs.present == 'true' && inputs.mode == 'auto'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GITHUB_SHA: ${{ steps.source.outputs.sha }}
        run: |
          chmod +x scripts/eas-continuous-deploy.sh
          args=(
            --profile production
            --channel production
            --environment production
            --platform "${{ inputs.platform }}"
            --auto-submit
            --message "${{ inputs.message || format('Production auto ({0})', steps.source.outputs.sha) }}"
          )
          if [ -n "${{ inputs.runtime_version }}" ]; then
            args+=(--runtime-version "${{ inputs.runtime_version }}")
          fi
          ./scripts/eas-continuous-deploy.sh "${args[@]}"

      - name: Build and submit
        if: steps.expo-token.outputs.present == 'true' && inputs.mode == 'build'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          MOBILE_BUILD_PROFILE: ${{ inputs.profile || 'production' }}
        run: |
          set -o pipefail
          eas build --platform ${{ inputs.platform }} --profile "$MOBILE_BUILD_PROFILE" --auto-submit --non-interactive --no-wait 2>&1 | tee /tmp/eas-build.log
          if grep -q 'used its iOS builds from the Free plan' /tmp/eas-build.log; then
            echo "::error::Expo Free plan iOS build quota exhausted. Upgrade at https://expo.dev/accounts/patroza/settings/billing or wait for the monthly reset, then re-run mode=build. Pure-JS fixes can still ship via mode=auto (fallback OTA) or mode=update with runtime_version."
          fi

      - name: Publish OTA update (manual)
        if: steps.expo-token.outputs.present == 'true' && github.event_name == 'workflow_dispatch' && inputs.mode == 'update'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GITHUB_SHA: ${{ steps.source.outputs.sha }}
          RUNTIME_VERSION: ${{ inputs.runtime_version }}
        run: |
          chmod +x scripts/eas-continuous-deploy.sh
          args=(
            --profile production
            --channel production
            --environment production
            --platform "${{ inputs.platform }}"
            --message "${{ inputs.message || format('Production OTA ({0})', steps.source.outputs.sha) }}"
          )
          if [ -n "$RUNTIME_VERSION" ]; then
            args+=(--runtime-version "$RUNTIME_VERSION")
          else
            # mode=update without runtime: publish under fingerprint policy only
            # (no native rebuild attempt). Use --runtime-version to target an
            # installed binary when fingerprints drifted.
            :
          fi
          if [ -n "$RUNTIME_VERSION" ]; then
            ./scripts/eas-continuous-deploy.sh "${args[@]}"
          else
            eas update \
              --channel production \
              --environment production \
              --platform ${{ inputs.platform }} \
              --message "${{ inputs.message || format('Production OTA ({0})', steps.source.outputs.sha) }}" \
              --non-interactive
          fi
