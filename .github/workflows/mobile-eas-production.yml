name: Mobile EAS Production

# Production builds and OTA updates run from CI (Linux) — never from a laptop.
# Under the fingerprint runtime-version policy the fingerprint must be computed
# in the same OS/pnpm as the EAS build; a macOS `eas build` computes a different
# fingerprint (platform-specific deps + pnpm version) and errors. On this Linux
# runner, with corepack pinning pnpm 10.24 in eas.json, local == build.
#
# Fork Release dispatches this workflow for an approved fork/dev SHA. Auto mode
# reuses matching native builds, or builds and submits the selected platforms.
# A failed native build can still publish pure-JS fixes to an installed runtime.
# Manual dispatch can select the iOS testflight profile and its fixed major
# version, or force an OTA runtime. Store releases use the production profile.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "auto (fingerprint decides), build (+ auto-submit to TestFlight / Google Play), or update (OTA)"
        required: true
        type: choice
        default: auto
        options:
          - auto
          - build
          - update
      profile:
        description: "production: store release; testflight: iOS 3.0.0 beta"
        required: true
        type: choice
        default: production
        options:
          - production
          - testflight
      platform:
        description: "Target platform"
        required: true
        type: choice
        default: all
        options:
          - ios
          - android
          - all
      version:
        description: "Optional build version override (blank uses profile default; store overrides are committed)"
        required: false
        type: string
      message:
        description: "OTA update message (mode=update / auto)"
        required: false
        type: string
      runtime_version:
        description: "Force OTA runtimeVersion (mode=update or auto). Blank = fingerprint / fallback"
        required: false
        type: string
      sha:
        description: "Exact release-branch SHA (blank uses that branch's current tip)"
        required: false
        type: string
      release_branch:
        description: "Release branch that must contain the SHA"
        required: false
        type: string
        default: fork/dev

concurrency:
  group: mobile-eas-production
  cancel-in-progress: false

jobs:
  production:
    name: EAS ${{ inputs.profile || 'production' }} ${{ inputs.mode }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
    env:
      APP_VARIANT: production
      NODE_OPTIONS: --max-old-space-size=8192
      T3CODE_MOBILE_EAS_PROJECT_ID: ${{ vars.T3CODE_MOBILE_EAS_PROJECT_ID }}
      T3CODE_MOBILE_EXPO_OWNER: ${{ vars.T3CODE_MOBILE_EXPO_OWNER }}
      T3CODE_MOBILE_IOS_BUNDLE_IDENTIFIER: ${{ vars.T3CODE_MOBILE_IOS_BUNDLE_IDENTIFIER }}
      T3CODE_MOBILE_IOS_TEAM_ID: ${{ vars.T3CODE_MOBILE_IOS_TEAM_ID }}
    steps:
      - name: Validate TestFlight inputs
        if: github.event_name == 'workflow_dispatch' && inputs.profile == 'testflight'
        env:
          PLATFORM: ${{ inputs.platform }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ "$PLATFORM" != "ios" ] || [ -n "$VERSION" ]; then
            echo "::error::TestFlight uses platform=ios and its fixed version. Use production for a committed store version."
            exit 1
          fi

      - id: expo-token
        name: Check for EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "EXPO_TOKEN is not available; skipping EAS production job."
          fi

      - id: version_app_token
        name: Mint release app token for version override
        if: steps.expo-token.outputs.present == 'true' && github.event_name == 'workflow_dispatch' && inputs.mode == 'build' && inputs.version != '' && inputs.profile != 'testflight'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout
        if: steps.expo-token.outputs.present == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_branch }}
          fetch-depth: 0
          token: ${{ steps.version_app_token.outputs.token || github.token }}
          # No sparse-checkout here: it makes actions/checkout fetch with
          # --filter=blob:none, and eas-cli archives the project via
          # `git clone --depth 1 file://<workspace>`, which fails (exit 128)
          # when the partial clone can't serve the unfetched blobs.

      - id: source
        name: Resolve approved release source
        if: steps.expo-token.outputs.present == 'true'
        env:
          REQUESTED_SHA: ${{ inputs.sha }}
        run: |
          release_sha="$(git rev-parse HEAD)"
          target_sha="${REQUESTED_SHA:-$release_sha}"
          if [[ ! "$target_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "sha must be an exact 40-character commit SHA" >&2
            exit 1
          fi
          git fetch origin "$target_sha"
          git merge-base --is-ancestor "$target_sha" "$release_sha"
          git checkout --detach "$target_sha"
          test "$(git rev-parse HEAD)" = "$target_sha"
          echo "sha=$target_sha" >> "$GITHUB_OUTPUT"

      # Workflow file may come from a feature branch (workflow_dispatch --ref)
      # while product code is always the approved release SHA above. Overlay
      # the deploy script + app.config runtime override from the workflow ref so
      # we can ship fixes without waiting for a full compose.
      - name: Overlay deploy tooling from workflow ref
        if: steps.expo-token.outputs.present == 'true' && github.ref_name != inputs.release_branch
        env:
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          git fetch origin "$WORKFLOW_SHA"
          for path in \
            apps/mobile/scripts/eas-continuous-deploy.sh \
            apps/mobile/scripts/lib \
            apps/mobile/app.config.ts \
            .easignore; do
            if git cat-file -e "${WORKFLOW_SHA}:${path}" 2>/dev/null; then
              git checkout "$WORKFLOW_SHA" -- "$path"
              echo "overlaid $path from $WORKFLOW_SHA"
            fi
          done
          chmod +x apps/mobile/scripts/eas-continuous-deploy.sh

      - name: Setup Vite+
        if: steps.expo-token.outputs.present == 'true'
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/mobile...

      - name: Expose pnpm
        if: steps.expo-token.outputs.present == 'true'
        run: |
          pnpm_version="$(node --print "require('./package.json').packageManager.split('@').pop()")"
          vp_pnpm_bin="$HOME/.vite-plus/package_manager/pnpm/$pnpm_version/pnpm/bin"
          echo "$vp_pnpm_bin" >> "$GITHUB_PATH"
          "$vp_pnpm_bin/pnpm" --version

      - name: Setup EAS
        if: steps.expo-token.outputs.present == 'true'
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          # npm, not pnpm: this only installs eas-cli into the action's own
          # tool dir, and pnpm 11 hard-fails that install on dtrace-provider's
          # ignored build script (no allowBuilds config outside the repo).
          packager: npm

      - name: Pull production environment variables
        if: steps.expo-token.outputs.present == 'true'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          RELEASE_PLATFORM: ${{ inputs.platform }}
        run: |
          eas env:pull production --non-interactive
          # EAS commands skip dotenv, and the Android fingerprint hashes this
          # file. Without it every merge misses the build's hash and rebuilds.
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from "node:fs";
          import { parseEnv } from "node:util";
          if (process.env.RELEASE_PLATFORM === "ios") process.exit(0);
          const env = parseEnv(readFileSync(".env.local", "utf8"));
          const googleServicesFile = env.T3CODE_ANDROID_GOOGLE_SERVICES_FILE;
          if (!googleServicesFile) {
            throw new Error("T3CODE_ANDROID_GOOGLE_SERVICES_FILE is missing from the production environment");
          }
          appendFileSync(process.env.GITHUB_ENV, `T3CODE_ANDROID_GOOGLE_SERVICES_FILE=${googleServicesFile}\n`);
          NODE

      - name: Apply manual version override
        if: steps.version_app_token.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.version_app_token.outputs.token }}
          APP_SLUG: ${{ steps.version_app_token.outputs.app-slug }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" != "branch" ]; then
            echo "Version overrides require dispatching this workflow from a branch; received $GITHUB_REF_TYPE '$GITHUB_REF_NAME'." >&2
            exit 1
          fi
          if ! [[ "$RELEASE_VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then
            echo "Version override must contain two or three dot-separated integers; received '$RELEASE_VERSION'." >&2
            exit 1
          fi

          node --input-type=module -e '
            import fs from "node:fs";
            const path = "apps/mobile/app.config.ts";
            const source = fs.readFileSync(path, "utf8");
            const next = source.replace(
              /^(  version: repoEnv\.T3CODE_MOBILE_VERSION \?\? ")[^"]+(".*)$/m,
              `$1${process.env.RELEASE_VERSION}$2`,
            );
            if (next === source && !source.includes(`  version: repoEnv.T3CODE_MOBILE_VERSION ?? "${process.env.RELEASE_VERSION}"`)) {
              throw new Error("Could not update app version");
            }
            fs.writeFileSync(path, next);
          '
          vp fmt apps/mobile/app.config.ts

          if git diff --quiet -- apps/mobile/app.config.ts; then
            echo "app.config.ts is already at $RELEASE_VERSION; no version commit needed."
            exit 0
          fi

          user_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git add apps/mobile/app.config.ts
          git commit --no-verify \
            -m "chore(mobile): bump app version to $RELEASE_VERSION" \
            -m "Co-authored-by: codex <codex@users.noreply.github.com>"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"

      - name: Summarize manual build version
        if: steps.expo-token.outputs.present == 'true' && github.event_name == 'workflow_dispatch' && inputs.mode == 'build'
        working-directory: apps/mobile
        env:
          MOBILE_BUILD_PROFILE: ${{ inputs.profile || 'production' }}
        run: |
          if [ "$MOBILE_BUILD_PROFILE" = "testflight" ]; then
            T3CODE_MOBILE_VERSION="$(node -p 'require("./eas.json").build.testflight.env.T3CODE_MOBILE_VERSION')"
            export T3CODE_MOBILE_VERSION
          fi
          version="$(npx expo config --json --type public | jq -r '.version')"
          {
            echo "## Manual $MOBILE_BUILD_PROFILE build"
            echo
            echo "- App version: \`$version\`"
            echo "- Platform: \`${{ inputs.platform }}\`"
            echo
            echo "> Apple closes an iOS release train after App Store approval. Before building iOS, confirm \`$version\` is newer than the approved App Store version."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy with fingerprint check (auto)
        if: steps.expo-token.outputs.present == 'true' && inputs.mode == 'auto'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GITHUB_SHA: ${{ steps.source.outputs.sha }}
          MOBILE_BUILD_PROFILE: ${{ inputs.profile || 'production' }}
          RUNTIME_VERSION: ${{ inputs.runtime_version }}
          OTA_MESSAGE: ${{ inputs.message || format('Production auto ({0})', steps.source.outputs.sha) }}
        run: |
          if [ "$MOBILE_BUILD_PROFILE" = "testflight" ]; then
            T3CODE_MOBILE_VERSION="$(node -p 'require("./eas.json").build.testflight.env.T3CODE_MOBILE_VERSION')"
            export T3CODE_MOBILE_VERSION
          fi
          chmod +x scripts/eas-continuous-deploy.sh
          args=(
            --profile "$MOBILE_BUILD_PROFILE"
            --channel production
            --environment production
            --platform "${{ inputs.platform }}"
            --auto-submit
            --message "$OTA_MESSAGE"
          )
          if [ -n "$RUNTIME_VERSION" ]; then
            args+=(--runtime-version "$RUNTIME_VERSION")
          fi
          ./scripts/eas-continuous-deploy.sh "${args[@]}"

      - name: Build and submit
        if: steps.expo-token.outputs.present == 'true' && inputs.mode == 'build'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          MOBILE_BUILD_PROFILE: ${{ inputs.profile || 'production' }}
        run: |
          set -o pipefail
          build_status=0
          eas build --platform ${{ inputs.platform }} --profile "$MOBILE_BUILD_PROFILE" --auto-submit --non-interactive --wait 2>&1 | tee /tmp/eas-build.log || build_status=$?
          if grep -q 'used its iOS builds from the Free plan' /tmp/eas-build.log; then
            echo "::error::Expo Free plan iOS build quota exhausted. Upgrade at https://expo.dev/accounts/patroza/settings/billing or wait for the monthly reset, then re-run mode=build. Pure-JS fixes can still ship via mode=auto (fallback OTA) or mode=update with runtime_version."
          fi
          exit "$build_status"

      # @expo/fingerprint swallows autolinking errors and returns no Expo module
      # sources, so native changes stop moving the hash and OTAs reach binaries
      # that lack them. Refuse to publish any OTA from such a fingerprint.
      - name: Verify fingerprints hash Expo native modules
        if: steps.expo-token.outputs.present == 'true' && (github.event_name == 'push' || inputs.mode == 'update')
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          PLATFORM: ${{ inputs.platform || 'all' }}
        run: |
          if [ "$PLATFORM" = "all" ]; then platforms="ios android"; else platforms="$PLATFORM"; fi
          failed=0
          for platform in $platforms; do
            # eas-cli prints an environment-loaded notice to stdout before the
            # JSON even with --json, so discard everything before the document.
            expo_modules="$(eas fingerprint:generate --platform "$platform" --environment production --json --non-interactive | sed -n '/^{/,$p' | jq --arg reason "expoAutolinking${platform^}" '[.sources[] | select((.reasons // []) | index($reason))] | length')"
            if [ "${expo_modules:-0}" -eq 0 ]; then
              failed=1
              echo ":x: $platform: the native fingerprint hashes no Expo native modules — OTAs and builds skipped" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          exit "$failed"

      - name: Publish OTA update (manual)
        if: steps.expo-token.outputs.present == 'true' && github.event_name == 'workflow_dispatch' && inputs.mode == 'update'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GITHUB_SHA: ${{ steps.source.outputs.sha }}
          RUNTIME_VERSION: ${{ inputs.runtime_version }}
          MOBILE_BUILD_PROFILE: ${{ inputs.profile || 'production' }}
          OTA_MESSAGE: ${{ inputs.message || format('Production OTA ({0})', steps.source.outputs.sha) }}
        run: |
          if [ "$MOBILE_BUILD_PROFILE" = "testflight" ]; then
            T3CODE_MOBILE_VERSION="$(node -p 'require("./eas.json").build.testflight.env.T3CODE_MOBILE_VERSION')"
            export T3CODE_MOBILE_VERSION
          fi
          chmod +x scripts/eas-continuous-deploy.sh
          args=(
            --profile "$MOBILE_BUILD_PROFILE"
            --channel production
            --environment production
            --platform "${{ inputs.platform }}"
            --message "$OTA_MESSAGE"
          )
          if [ -n "$RUNTIME_VERSION" ]; then
            args+=(--runtime-version "$RUNTIME_VERSION")
          fi
          if [ -n "$RUNTIME_VERSION" ]; then
            ./scripts/eas-continuous-deploy.sh "${args[@]}"
          else
            eas update \
              --channel production \
              --environment production \
              --platform ${{ inputs.platform }} \
              --message "$OTA_MESSAGE" \
              --emit-metadata \
              --non-interactive
          fi
      # Lets the relay symbolicate crash stacks from the updates published
      # above. A step of its own so the R2 credentials reach only this script,
      # not `eas update` and the dependencies it runs. Never fails the job.
      - name: Upload OTA source maps
        if: ${{ !cancelled() && steps.expo-token.outputs.present == 'true' }}
        working-directory: apps/mobile
        env:
          MOBILE_SOURCEMAPS_R2: ${{ secrets.MOBILE_SOURCEMAPS_R2 }}
        run: |
          for dir in dist dist-*; do
            if [ -f "$dir/eas-update-metadata.json" ]; then
              node scripts/upload-sourcemaps.mts ota "$dir"
            fi
          done
