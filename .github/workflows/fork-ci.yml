name: Fork CI

env:
  # Install dependencies without downloading Electron in every job. The desktop jobs
  # fetch and verify the runtime explicitly below; mobile lint and release smoke do not need it.
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

on:
  workflow_dispatch:
    inputs:
      # Tim/candidates provenance tips do not carry fork-ci.yml (only upstream
      # Blacksmith ci.yml). Dispatch against fork/changes (or any ref that has
      # this workflow) and set checkout_ref to the tip under test so checks
      # attach to that SHA / permanent draft PR.
      checkout_ref:
        description: "Git ref or SHA to check out and test (default: dispatch ref)"
        required: false
        type: string
        default: ""
  # Full PR CI for product layers. Job names match required checks (Check / Test /
  # Mobile Native Static Analysis / Release Smoke) on protected bases.
  #
  # Permanent stack PRs (bases):
  # - #255 base → main (dispatch only; do not list main here)
  # - #1 tim → fork/base
  # - #27 candidates → fork/tim
  # - #2 changes → fork/candidates
  #
  # Upstream Blacksmith CI must stay disabled_manually. fork/base supplies
  # GitHub-hosted runners + fork-ci.yml for all layers above it.
  #
  # Keep overlay bases in sync with integrationOverlays in pr-stack.json.
  pull_request:
    branches:
      - fork/base
      - fork/tim
      - fork/candidates
      - fork/changes
      # Stable contributor and release branch (docs/stable-dev-release-branch-handover.md).
      - fork/dev
      # Registered integration overlays (same names as .github/pr-stack.json)
      - t3-discord/f7d37879-desktop-deeplinks
      - fork/discord
      - fork/vscode
      - fork/identity
  # fork/dev is never rebased, so its merge commits are the release candidates.
  # Deployment promotes an exact green SHA and keys on a successful run of this
  # workflow for that SHA, so every merge must produce one — a green PR tip is
  # not enough when the merge SHA differs.
  push:
    branches:
      - fork/dev

concurrency:
  # Push runs are keyed by SHA and never cancelled: the conclusion of a push run
  # is what approves that exact commit for deployment, so cancelling one as
  # superseded would leave that merge SHA permanently unapprovable.
  group: ci-${{ github.event.pull_request.number || inputs.checkout_ref ||
    (github.event_name == 'push' && github.sha) || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout_ref != '' && inputs.checkout_ref || github.sha }}

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Restore Vite Task check cache
        id: vite-task-check-cache
        uses: actions/cache/restore@v6
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-check-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vite-task-check-${{ runner.os }}-${{ runner.arch }}-

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Check
        run: vp check

      - name: Typecheck
        run: vp run -r --cache --log labeled typecheck

      - name: Build desktop pipeline
        run: vp run --cache build:desktop

      - name: Verify preload bundle output
        run: |
          test -f apps/desktop/dist-electron/preload.cjs
          grep -nE "desktopBridge|getLocalEnvironmentBootstrap|PICK_FOLDER_CHANNEL|wsUrl" apps/desktop/dist-electron/preload.cjs
          grep -n "__clerk_internal_electron_passkeys" apps/desktop/dist-electron/preload.cjs

      - name: Save Vite Task check cache
        if: success()
        uses: actions/cache/save@v6
        with:
          path: node_modules/.vite/task-cache
          key: ${{ steps.vite-task-check-cache.outputs.cache-primary-key }}

  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout_ref != '' && inputs.checkout_ref || github.sha }}

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Test
        run: vp run test

  mobile_native_static_analysis:
    name: Mobile Native Static Analysis
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout_ref != '' && inputs.checkout_ref || github.sha }}

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          # Saving the complete macOS node_modules cache takes ~95 seconds and
          # loses the cache reservation whenever parallel PR runs overlap.
          # A clean install is faster and has deterministic completion time.
          cache: false
          run-install: true

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Test macOS Open With integration
        # Present from Tim onward; fork/base is CI plumbing only and lacks this path.
        run: |
          if [[ -f apps/desktop/src/shell/DesktopOpenWith.test.ts ]]; then
            vp test run apps/desktop/src/shell/DesktopOpenWith.test.ts
          else
            echo "DesktopOpenWith tests not on this tip; skipping."
          fi

      - name: Install mobile native static analysis tools
        run: brew bundle install --file apps/mobile/Brewfile

      - name: Lint mobile native sources
        run: vp run lint:mobile

  release_smoke:
    name: Release Smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout_ref != '' && inputs.checkout_ref || github.sha }}

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Exercise release-only workflow steps
        run: node scripts/release-smoke.ts

  deployment_scope:
    name: Classify Deployment Scope
    # Two release tips during the cutover: the composed fork/integration tip
    # (dispatched by the stack workflow) and fork/dev merge commits. Keep both
    # until fork/integration is retired.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/fork/integration') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/fork/dev')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      deploy: ${{ steps.classify.outputs.deploy }}
      server: ${{ steps.classify.outputs.server }}
      discord: ${{ steps.classify.outputs.discord }}
      vscode: ${{ steps.classify.outputs.vscode }}
      mobile: ${{ steps.classify.outputs.mobile }}
      desktop: ${{ steps.classify.outputs.desktop }}
    steps:
      - name: Checkout integration source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Find previous successful release-tip CI
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
          # Compare against this branch's own history. Hardcoding
          # fork/integration + workflow_dispatch here would make every fork/dev
          # push diff against an unrelated tip and classify every component as
          # changed.
          SCOPE_BRANCH: ${{ github.ref_name }}
          SCOPE_EVENT: ${{ github.event_name }}
        run: |
          previous_sha="$(
            gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/fork-ci.yml/runs" \
              -f "branch=${SCOPE_BRANCH}" \
              -f "event=${SCOPE_EVENT}" \
              -f status=success \
              -f per_page=20 \
              --jq ".workflow_runs | map(select(.head_sha != \"${GITHUB_SHA}\")) | first | .head_sha // \"\""
          )"
          echo "sha=${previous_sha}" >>"${GITHUB_OUTPUT}"

      - name: Classify changes since previous successful integration CI
        id: classify
        env:
          PREVIOUS_SHA: ${{ steps.previous.outputs.sha }}
        run: |
          deploy=true
          server=true
          discord=true
          vscode=true
          mobile=true
          desktop=true
          if [[ "${PREVIOUS_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            if ! git cat-file -e "${PREVIOUS_SHA}^{commit}" 2>/dev/null; then
              git fetch --quiet origin "${PREVIOUS_SHA}" || true
            fi
            if git cat-file -e "${PREVIOUS_SHA}^{commit}" 2>/dev/null; then
              classification="$(
                scripts/classify-deployment-diff.sh "${PREVIOUS_SHA}" "${GITHUB_SHA}"
              )"
              printf '%s\n' "${classification}" >&2
              deploy="$(sed -n 's/^deploy=//p' <<<"${classification}")"
              server="$(sed -n 's/^server=//p' <<<"${classification}")"
              discord="$(sed -n 's/^discord=//p' <<<"${classification}")"
              vscode="$(sed -n 's/^vscode=//p' <<<"${classification}")"
              mobile="$(sed -n 's/^mobile=//p' <<<"${classification}")"
              desktop="$(sed -n 's/^desktop=//p' <<<"${classification}")"
            else
              echo "Previous successful integration SHA is unavailable; deployment remains enabled."
            fi
          else
            echo "No previous successful integration SHA; deployment remains enabled."
          fi
          echo "deploy=${deploy}" >>"${GITHUB_OUTPUT}"
          echo "server=${server}" >>"${GITHUB_OUTPUT}"
          echo "discord=${discord}" >>"${GITHUB_OUTPUT}"
          echo "vscode=${vscode}" >>"${GITHUB_OUTPUT}"
          echo "mobile=${mobile}" >>"${GITHUB_OUTPUT}"
          echo "desktop=${desktop}" >>"${GITHUB_OUTPUT}"

  dispatch_mobile_releases:
    name: Dispatch Mobile Releases
    needs: [check, test, mobile_native_static_analysis, release_smoke, deployment_scope]
    if: >-
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/fork/integration') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/fork/dev')) &&
      needs.deployment_scope.outputs.mobile == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch exact release SHA
        env:
          GH_TOKEN: ${{ github.token }}
          # Dispatch against the branch this run is validating so the mobile
          # workflows come from the same tip, not a stale fork/integration copy.
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          # mode=auto, not update: an OTA alone never reaches a phone when the
          # native runtime changed, so the fingerprint decides between an update
          # and a TestFlight build. iOS only, because Android has no keystore.
          # release_branch must match: the mobile workflows check out that branch
          # and verify the SHA is contained by it. Defaulting it to
          # fork/integration there would reject every fork/dev SHA.
          gh workflow run mobile-eas-production.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$RELEASE_REF" \
            -f mode=auto \
            -f platform=ios \
            -f sha="$GITHUB_SHA" \
            -f release_branch="$RELEASE_REF" \
            -f message="${RELEASE_REF} ${GITHUB_SHA}"
          gh workflow run mobile-eas-development.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$RELEASE_REF" \
            -f platform=ios \
            -f sha="$GITHUB_SHA" \
            -f release_branch="$RELEASE_REF"
